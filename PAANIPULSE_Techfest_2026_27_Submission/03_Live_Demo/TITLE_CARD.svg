<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Competition Pill -->
  <g transform="translate(960, 240)">
    <rect x="-350" y="-28" width="700" height="56" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-315" cy="0" r="8" fill="#38bdf8"/>
    <text x="0" y="8" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      TECHFEST 2026–27 CAMPUS TO CLOUD HACKATHON (AWS)
    </text>
  </g>

  <!-- Project Name -->
  <text x="960" y="440" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="110" font-weight="900" letter-spacing="4" text-anchor="middle">
    PAANI<tspan fill="#38bdf8">PULSE</tspan>
  </text>
  <text x="960" y="510" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="bold" letter-spacing="6" text-anchor="middle">
    पानीय पल्स • CIVIC WATER INTELLIGENCE
  </text>

  <!-- Tagline -->
  <text x="960" y="600" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-style="italic" text-anchor="middle">
    “Know your neighbourhood’s water situation before the tap runs dry.”
  </text>

  <!-- Problem / Solution description -->
  <text x="960" y="670" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" text-anchor="middle">
    India's Community-Powered Water Intelligence &amp; Early Disruption Detection Network
  </text>

  <!-- Bottom Badges Grid -->
  <g transform="translate(960, 800)">
    <!-- Badge 1: AWS Stack -->
    <rect x="-560" y="-40" width="350" height="80" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="-385" y="-8" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">100% AWS SERVERLESS</text>
    <text x="-385" y="20" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">API Gateway • Lambda • DynamoDB</text>

    <!-- Badge 2: Innovation -->
    <rect x="-175" y="-40" width="350" height="80" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="-8" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CIVIC INNOVATION</text>
    <text x="0" y="20" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Water Fingerprint • Anomaly Alert</text>

    <!-- Badge 3: GitHub -->
    <rect x="210" y="-40" width="350" height="80" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="385" y="-8" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">OPEN SOURCE (MIT)</text>
    <text x="385" y="20" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">github.com/adiTya2106-thakare</text>
  </g>

  <!-- Footer Team ID & Date -->
  <text x="960" y="980" fill="#64748b" font-family="sans-serif" font-size="18" text-anchor="middle">
    Official Round 1 Hackathon Submission Deliverable • IIT Bombay Techfest 2026–27
  </text>
</svg>

