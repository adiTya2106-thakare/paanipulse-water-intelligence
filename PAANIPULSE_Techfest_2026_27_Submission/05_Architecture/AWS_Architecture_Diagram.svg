<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="90" x2="960" y2="90" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="270" x2="960" y2="270" />
    <line x1="0" y1="360" x2="960" y2="360" />
    <line x1="0" y1="450" x2="960" y2="450" />
    <line x1="160" y1="0" x2="160" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="640" y1="0" x2="640" y2="540" />
    <line x1="800" y1="0" x2="800" y2="540" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <circle cx="20" cy="20" r="18" fill="url(#cyanGrad)" />
    <text x="50" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" letter-spacing="1">
      PAANI<tspan fill="#38bdf8">PULSE</tspan> — AWS SERVERLESS CLOUD ARCHITECTURE
    </text>
    <text x="50" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      Techfest 2026–27 Campus to Cloud Hackathon (AWS) • Production High-Availability Design
    </text>
  </g>

  <!-- Flow Arrows -->
  <!-- Client to API Gateway -->
  <path d="M 230 250 L 320 250" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />
  <polygon points="325,250 315,245 315,255" fill="#38bdf8" />
  <text x="275" y="238" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">HTTPS</text>

  <!-- API Gateway to Lambda -->
  <path d="M 470 250 L 560 250" stroke="#fbbf24" stroke-width="2.5" fill="none" />
  <polygon points="565,250 555,245 555,255" fill="#fbbf24" />
  <text x="515" y="238" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">PROXY</text>

  <!-- Lambda to DynamoDB -->
  <path d="M 710 250 L 800 250" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <polygon points="805,250 795,245 795,255" fill="#38bdf8" />
  <text x="755" y="238" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">BOTO3</text>

  <!-- Lambda down to CloudWatch -->
  <path d="M 635 340 L 635 410" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="635,415 630,405 640,405" fill="#94a3b8" />
  <text x="645" y="380" fill="#94a3b8" font-family="monospace" font-size="10">LOGS</text>

  <!-- BOX 1: CLIENT LAYER (Frontend & Edge) -->
  <g transform="translate(60, 160)">
    <rect width="170" height="180" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="36" rx="16" fill="#0369a1" />
    <text x="85" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      CLIENT & EDGE
    </text>
    <text x="15" y="65" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">React 19 + Vite</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Mobile-First UI</text>
    <text x="15" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Tailwind CSS</text>
    <text x="15" y="121" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Anonymous Token</text>
    <rect x="15" y="135" width="140" height="25" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="85" y="152" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      AWS Amplify Hosting
    </text>
  </g>

  <!-- BOX 2: API GATEWAY -->
  <g transform="translate(320, 160)">
    <rect width="150" height="180" rx="16" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="36" rx="16" fill="#b45309" />
    <text x="75" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      API GATEWAY (HTTP)
    </text>
    <text x="15" y="65" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">HTTP API v2</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">• CORS Preflight</text>
    <text x="15" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Route Dispatch</text>
    <text x="15" y="121" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Burst Throttling</text>
    <rect x="15" y="135" width="120" height="25" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="75" y="152" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      $default Catch-all
    </text>
  </g>

  <!-- BOX 3: AWS LAMBDA -->
  <g transform="translate(560, 140)">
    <rect width="150" height="200" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="36" rx="16" fill="#0369a1" />
    <text x="75" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      AWS LAMBDA
    </text>
    <text x="15" y="65" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Python 3.12</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Confidence Model</text>
    <text x="15" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Diurnal Fingerprint</text>
    <text x="15" y="121" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Anomaly Detector</text>
    <text x="15" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Device Rate-Limit</text>
    <rect x="15" y="155" width="120" height="25" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="75" y="172" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      Memory: 256 MB
    </text>
  </g>

  <!-- BOX 4: AMAZON DYNAMODB -->
  <g transform="translate(800, 160)">
    <rect width="140" height="180" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="36" rx="16" fill="#047857" />
    <text x="70" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      AMAZON DYNAMODB
    </text>
    <text x="15" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">PaanipulseReports</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">PK: localityId (S)</text>
    <text x="15" y="103" fill="#cbd5e1" font-family="sans-serif" font-size="11">SK: time#repId (S)</text>
    <text x="15" y="121" fill="#cbd5e1" font-family="sans-serif" font-size="11">• PAY_PER_REQUEST</text>
    <rect x="15" y="135" width="110" height="25" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="152" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
      Zero Table Scans
    </text>
  </g>

  <!-- BOX 5: CLOUDWATCH (Bottom) -->
  <g transform="translate(560, 420)">
    <rect width="150" height="70" rx="12" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="1" />
    <text x="75" y="25" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      AMAZON CLOUDWATCH
    </text>
    <text x="75" y="45" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">
      Serverless Logs & Alarms
    </text>
    <text x="75" y="58" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">
      14-Day Retention
    </text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 495)">
    <rect width="840" height="30" rx="8" fill="#1e293b" opacity="0.6" />
    <text x="420" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">
      Cost Structure: 100% Free Tier Eligible • Estimated Monthly Cloud Cost: $0.00 • High Availability
    </text>
  </g>
</svg>
